name: wheels

# Five runners, every CPython in requires-python on each, and the whole test
# suite inside every wheel: the most expensive thing in this repository by a
# wide margin. tests.yml already covers the same three operating systems at
# the oldest and newest Python on every push, so what this adds is packaging
# -- which only what goes into a package can break. Hence the paths filter:
# a change to lazpy/ or tests/ alone is covered by tests.yml, and a release
# builds everything regardless of what changed.
on:
  push:
    branches: [main]
    paths: &packaging
      - 'src/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/wheels.yml'
  pull_request:
    paths: *packaging
  release:
    types: [published]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux + musllinux x86_64
          - ubuntu-24.04-arm   # manylinux + musllinux aarch64
          - macos-latest       # arm64
          - macos-15-intel     # x86_64, retired by GitHub in Aug 2027
          - windows-latest     # AMD64
    steps:
      - uses: actions/checkout@v7

      # Builds every CPython in requires-python and runs the test suite inside
      # each resulting wheel; see [tool.cibuildwheel] in pyproject.toml.
      - uses: pypa/cibuildwheel@v4.2.0

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build
        run: pipx run build --sdist

      # The sdist has to carry src/, testdata/ and tests/, not just the
      # package: building and testing it from a scratch directory is the only
      # thing that proves it.
      - name: Build and test from the sdist
        run: |
          set -euo pipefail
          mkdir -p ~/sdist-check && tar xzf dist/*.tar.gz -C ~/sdist-check
          python -m venv ~/sdist-venv
          # numpy too, or the array tests skip and this job passes without
          # ever running them -- which is what tests.yml and cibuildwheel's
          # test-requires both install it for
          ~/sdist-venv/bin/pip install pytest numpy dist/*.tar.gz
          cd ~/sdist-check
          ~/sdist-venv/bin/pytest -q lazpy-*/tests

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A version on PyPI cannot be replaced, so publishing one that does not
      # match the tag is not something to notice afterwards. The version comes
      # from pyproject.toml and the tag from whoever made the release, and
      # nothing has been making them agree.
      - name: Check the tag against the version being published
        run: |
          set -euo pipefail
          version=$(ls dist/lazpy-*.tar.gz | sed -E 's|.*/lazpy-(.+)\.tar\.gz|\1|')
          tag=${GITHUB_REF_NAME#v}
          echo "tag $GITHUB_REF_NAME, built version $version"
          test "$version" = "$tag"

      - uses: pypa/gh-action-pypi-publish@release/v1
