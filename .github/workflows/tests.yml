name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Style is host- and version-independent, so it runs once rather than across
  # the matrix below. No build either: flake8 reads the sources, and the only
  # thing in the tree it cannot read is the C extension, which it ignores.
  lint:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: python -m pip install flake8

      # Settings live in .flake8, so this is what a bare `flake8` does locally.
      - run: flake8

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest and newest supported; cibuildwheel covers everything between
        # when wheels are built.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install . pytest

      # Run from outside the checkout so `import lazpy` resolves to the
      # installed package rather than the source tree, which has no built
      # extension in it.
      - name: Test
        run: pytest -q "${{ github.workspace }}/tests"
        shell: bash
        working-directory: ${{ runner.temp }}
