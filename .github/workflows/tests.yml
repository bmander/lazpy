name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest and newest supported; cibuildwheel covers everything between
        # when wheels are built.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install . pytest

      # Run from outside the checkout so `import lazpy` resolves to the
      # installed package rather than the source tree, which has no built
      # extension in it.
      - name: Test
        run: pytest -q "${{ github.workspace }}/tests"
        shell: bash
        working-directory: ${{ runner.temp }}
